[package]
name = "slint-dashboard"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "slint_dashboard"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "slint-dashboard"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["compat-1-18", "std", "backend-winit", "renderer-femtovg"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[build-dependencies]
slint-build = "1.18"
